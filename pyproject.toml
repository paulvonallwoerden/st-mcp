[project]
name = "st-mcp"
version = "0.1.0"
description = "MCP server providing access to st.com product data and technical documentation"
readme = "README.md"
authors = [
    { name = "Paul", email = "paul@paul-von-allwoerden.de" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "curl-cffi>=0.16.3",
    "markdownify>=1.2.3",
    "mcp[cli]>=2.3.0",
    "pymupdf>=2.0",
    "pymupdf4llm>=2.0",
]

[project.scripts]
st-mcp = "st_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
